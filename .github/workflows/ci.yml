name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.3"]
        rails: ["6.1", "7.0"]
        mongoid: ["7.4", "8.1"]
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/test/gemfiles/rails-${{ matrix.rails }}-mongoid-${{ matrix.mongoid }}.gemfile
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
